<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t { fill: #1a1a1a; }
    .muted { fill: #6b6b6b; }
    .head { fill: #ffffff; stroke: #333; stroke-width: 1.4; }
    .life { stroke: #999; stroke-width: 1; stroke-dasharray: 5 5; }
    .act { fill: #ececec; stroke: #555; stroke-width: 1; }
    .msg { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#m); }
    .ret { stroke: #777; stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; marker-end: url(#m2); }
    .lbl { fill: #1a1a1a; font-size: 11.5px; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="#333" stroke="none"/>
    </marker>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#777" stroke-width="1.1"/>
    </marker>
  </defs>
  <rect width="1120" height="760" fill="#ffffff"/>
  <text x="560" y="34" class="t" font-size="19" font-weight="bold" text-anchor="middle">Sequence Diagram — Optimize a Mesh</text>

  <!-- lifeline heads -->
  <g>
    <rect x="30" y="58" width="140" height="46" class="head" rx="3"/>
    <text x="100" y="80" class="t" font-size="12.5" font-weight="bold" text-anchor="middle">Client</text>
    <text x="100" y="96" class="muted" font-size="10.5" text-anchor="middle">browser / engine</text>

    <rect x="212" y="58" width="150" height="46" class="head" rx="3"/>
    <text x="287" y="80" class="t" font-size="12.5" font-weight="bold" text-anchor="middle">API</text>
    <text x="287" y="96" class="muted" font-size="10.5" text-anchor="middle">api.py / main.py</text>

    <rect x="404" y="58" width="140" height="46" class="head" rx="3"/>
    <text x="474" y="80" class="t" font-size="12.5" font-weight="bold" text-anchor="middle">Pipeline</text>
    <text x="474" y="96" class="muted" font-size="10.5" text-anchor="middle">core/pipeline.py</text>

    <rect x="586" y="58" width="150" height="46" class="head" rx="3"/>
    <text x="661" y="80" class="t" font-size="12.5" font-weight="bold" text-anchor="middle">FeatureExtractor</text>
    <text x="661" y="96" class="muted" font-size="10.5" text-anchor="middle">trimesh</text>

    <rect x="778" y="58" width="140" height="46" class="head" rx="3"/>
    <text x="848" y="80" class="t" font-size="12.5" font-weight="bold" text-anchor="middle">Blender</text>
    <text x="848" y="96" class="muted" font-size="10.5" text-anchor="middle">headless process</text>

    <rect x="958" y="58" width="130" height="46" class="head" rx="3"/>
    <text x="1023" y="80" class="t" font-size="12.5" font-weight="bold" text-anchor="middle">Storage</text>
    <text x="1023" y="96" class="muted" font-size="10.5" text-anchor="middle">inputs / outputs</text>
  </g>

  <!-- lifelines -->
  <g class="life">
    <line x1="100" y1="104" x2="100" y2="720"/>
    <line x1="287" y1="104" x2="287" y2="720"/>
    <line x1="474" y1="104" x2="474" y2="720"/>
    <line x1="661" y1="104" x2="661" y2="720"/>
    <line x1="848" y1="104" x2="848" y2="720"/>
    <line x1="1023" y1="104" x2="1023" y2="720"/>
  </g>

  <!-- activations -->
  <rect x="94" y="140" width="12" height="540" class="act"/>
  <rect x="281" y="168" width="12" height="478" class="act"/>
  <rect x="468" y="238" width="12" height="368" class="act"/>
  <rect x="655" y="270" width="12" height="44" class="act"/>
  <rect x="655" y="520" width="12" height="44" class="act"/>
  <rect x="842" y="360" width="12" height="120" class="act"/>

  <!-- messages -->
  <path d="M106 168 L 279 168" class="msg"/>
  <text x="192" y="160" class="lbl" text-anchor="middle">1: POST /api/v1/optimize (file, ratio)</text>

  <path d="M293 206 L 1017 206" class="msg"/>
  <text x="650" y="198" class="lbl" text-anchor="middle">2: save upload (size-checked, name sanitized)</text>

  <path d="M293 238 L 466 238" class="msg"/>
  <text x="380" y="230" class="lbl" text-anchor="middle">3: optimize(in, out, ratio)</text>

  <path d="M480 270 L 653 270" class="msg"/>
  <text x="566" y="262" class="lbl" text-anchor="middle">4: extract_mesh_features(input)</text>
  <path d="M653 308 L 480 308" class="ret"/>
  <text x="566" y="302" class="lbl" fill="#6b6b6b" text-anchor="middle">original features</text>

  <path d="M480 360 L 840 360" class="msg"/>
  <text x="660" y="352" class="lbl" text-anchor="middle">5: subprocess — blender --background process_mesh.py</text>

  <text x="848" y="392" class="lbl" fill="#6b6b6b" text-anchor="middle">import mesh</text>
  <text x="848" y="410" class="lbl" fill="#6b6b6b" text-anchor="middle">merge doubles, fix normals</text>
  <text x="848" y="428" class="lbl" fill="#6b6b6b" text-anchor="middle">apply Decimate (ratio)</text>
  <rect x="762" y="378" width="172" height="62" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>

  <path d="M854 468 L 1017 468" class="msg"/>
  <text x="936" y="460" class="lbl" text-anchor="middle">6: export .glb</text>

  <path d="M840 500 L 480 500" class="ret"/>
  <text x="660" y="494" class="lbl" fill="#6b6b6b" text-anchor="middle">exit code</text>

  <path d="M480 520 L 653 520" class="msg"/>
  <text x="566" y="512" class="lbl" text-anchor="middle">7: extract_mesh_features(output)</text>
  <path d="M653 558 L 480 558" class="ret"/>
  <text x="566" y="552" class="lbl" fill="#6b6b6b" text-anchor="middle">optimized features</text>

  <path d="M466 606 L 293 606" class="ret"/>
  <text x="380" y="600" class="lbl" fill="#6b6b6b" text-anchor="middle">report (metrics, reduction %)</text>

  <path d="M279 646 L 106 646" class="ret"/>
  <text x="192" y="640" class="lbl" fill="#6b6b6b" text-anchor="middle">200 OK — JSON or .glb binary</text>

  <text x="100" y="700" class="lbl" fill="#6b6b6b" text-anchor="middle">display / save file</text>

  <!-- alt note -->
  <rect x="30" y="716" width="1058" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="46" y="738" class="lbl" fill="#6b6b6b">Failure paths: unreadable mesh → 400 · upload too large → 413 · Blender timeout → 504 · no output file → 500</text>
</svg>
